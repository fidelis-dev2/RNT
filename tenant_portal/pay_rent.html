<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="../assets/css/style.css"></head><body class="page-doc"><main class="content"><div class="crumb">Tenant Portal › Pay Rent</div><div class="page-head"><div><h2>Pay Rent</h2><p>Choose a method and record your rent payment.</p></div></div><section class="form-card"><form id="tenantPayForm"><div class="form-grid"><div class="input-group"><label>Property</label><input value="Sunset Apartments" readonly></div><div class="input-group"><label>Unit</label><input value="A-12" readonly></div><div class="input-group"><label>Payment Month</label><input name="month" type="month" value="2026-10" required></div><div class="input-group"><label>Amount (TZS)</label><input name="amount" type="number" value="1200000" required></div><div class="input-group full"><label>Payment Method</label><div class="payment-method-grid"><label class="payment-method"><input type="radio" name="method" value="Mobile Money" checked><i class="fa-solid fa-mobile-screen-button"></i><br>Mobile Money</label><label class="payment-method"><input type="radio" name="method" value="Bank Transfer"><i class="fa-solid fa-building-columns"></i><br>Bank Transfer</label><label class="payment-method"><input type="radio" name="method" value="Cash"><i class="fa-solid fa-money-bill"></i><br>Cash</label></div></div><div class="input-group"><label>Phone / Account</label><input name="account" placeholder="e.g. 0712444111"></div><div class="input-group"><label>Reference Number</label><input name="reference" placeholder="Transaction reference"></div></div><div class="notice"><i class="fa-solid fa-circle-info"></i> Frontend demo: payment is recorded locally. Connect this form to your mobile-money/bank backend API for production.</div><div class="form-actions"><button class="btn-primary" type="submit"><i class="fa-solid fa-lock"></i> Confirm Payment</button></div></form></section></main><script src="../assets/js/language.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/tenant-portal.js"></script></body></html>
