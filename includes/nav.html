<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">


<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" referrerpolicy="no-referrer"><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/online-assets.css"><title>RNT Navigation</title></head>
<body class="frame-document include-document nav-document">
<header class="topbar">
  <div class="brand">
    <button id="moduleMenuButton" class="mobile-menu btn-outline" type="button" onclick="toggleModuleAside()" title="Open"><i class="fa-solid fa-bars"></i></button>
    <div class="brand-icon"><i class="fa-solid fa-house"></i></div>
    <div><h3>RNT</h3><span>Rental & Property Management System</span></div>
  </div>
  <div class="userbar">
    <div class="language-switch" aria-label="Language">
      <button type="button" class="lang-btn" data-language-button="en" onclick="setLanguage('en')">ENG</button>
      <button type="button" class="lang-btn" data-language-button="sw" onclick="setLanguage('sw')">SW</button>
    </div>
    <i class="fa-regular fa-bell" title="Notification"></i>
    <img class="avatar" alt="Admin User" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=160&h=160&q=90" loading="eager">
    <div class="user-text"><b>Admin User</b><br><small>System Administrator</small></div>
    <button class="btn-outline" type="button" title="Logout" onclick="logoutRNT()"><i class="fa-solid fa-right-from-bracket"></i></button>
  </div>
</header>
<script src="../assets/js/language.js"></script><script src="../assets/js/app.js"></script>
</body></html>
